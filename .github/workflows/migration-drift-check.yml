name: Migration drift check

# After every merge to main: fail if a migration added by the push has not been
# applied to the database (a deploy without its migration breaks the app).
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/checks/**"

permissions:
  contents: read

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that new migrations are applied
        env:
          SUPABASE_CHECK_DATABASE_URL: ${{ secrets.SUPABASE_CHECK_DATABASE_URL }}
        run: scripts/db/check-migrations.sh "${{ github.event.before }}" "${{ github.sha }}"
